# ============================================================
# PanSou Modern Web —— 纯前端部署（后端已存在时用这个）
# ------------------------------------------------------------
# 用法：
#   cp .env.example .env
#   vi .env                 # 把 PANSOU_BACKEND_URL 改成你的后端地址
#   docker compose config --quiet
#   docker compose pull
#   docker compose up -d --no-build
#   docker compose ps
#   docker compose logs -f --tail=100
#
# 详细说明见 README.md「三、只部署前端」。
# ============================================================

services:
  pansou-frontend:
    image: ${PANSOU_FRONTEND_IMAGE:-ghcr.io/jin66god/pansou-modern-web:latest}
    container_name: ${PANSOU_CONTAINER_NAME:-pansou-modern-web}
    labels:
      # 如果你同时跑着 autoheal，这行会让它在容器 unhealthy 时自动重启
      - "autoheal=true"
    restart: unless-stopped

    ports:
      # 默认只监听本机，公网访问请交给 OpenResty / Nginx / Caddy 反代
      - "${PANSOU_FRONTEND_BIND:-127.0.0.1}:${PANSOU_FRONTEND_PORT:-13080}:80"

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 关键项：指向你已经部署好的 PanSou 后端
      #   后端在宿主机上        -> http://host.docker.internal:8890
      #   后端在同 compose 网络  -> http://pansou:80
      #   后端在另一台机器       -> http://10.0.0.12:8890
      PANSOU_BACKEND_URL: ${PANSOU_BACKEND_URL:-http://host.docker.internal:8890}
      # 搜索是长请求，读超时要给足
      PANSOU_PROXY_READ_TIMEOUT: ${PANSOU_PROXY_READ_TIMEOUT:-180s}
      PANSOU_CLIENT_MAX_BODY_SIZE: ${PANSOU_CLIENT_MAX_BODY_SIZE:-8m}

    # Linux 上让 host.docker.internal 能解析到宿主机网关
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
