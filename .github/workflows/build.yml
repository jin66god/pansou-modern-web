name: Build and Publish

# 单一工作流：编译前端产物 -> 打包多架构镜像 -> 推 GHCR。
#
# 设计要点：
#   1. 静态资源只在 amd64 上编译一次（assets job），镜像阶段不再跑 node。
#      否则 linux/arm64 会在 QEMU 模拟下执行 npm ci + vite build，慢到十几分钟。
#   2. 之前仓库里同时存在三套 workflow 互相覆盖 latest 标签，且用了已废弃的
#      actions/upload-artifact@v3（GitHub 直接判失败），现已合并为本文件。

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 编译前端产物 ----------
  assets:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # devDependencies 里有 tailwindcss / postcss / typescript，必须显式包含
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          ls -lh dist dist/assets

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---------- 2. 打包并推送镜像 ----------
  publish:
    name: Build and push image
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PR 上不推送镜像，但必须保证 Dockerfile 本身能构建成功
      - name: Build only (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64
          push: false
          load: true
          tags: pansou-modern-web:pr
          cache-from: type=gha

      - name: Smoke test image (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name smoke -p 18080:80 \
            -e PANSOU_BACKEND_URL=http://127.0.0.1:8890 \
            pansou-modern-web:pr
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<div id="app"' && echo "SPA served OK"
          docker logs smoke
          docker rm -f smoke
